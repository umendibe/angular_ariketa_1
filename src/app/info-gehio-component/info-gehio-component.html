<div class="w-50 mx-auto mt-3 p-3">
    <form>
        <div class="form-group my-2">
            <label for="exampleInputEmail1">Izena eta Abizena</label>
            <input type="email" class="form-control" id="exampleInputEmail1"
                aria-describedby="emailHelp" placeholder="Adib. Ane Muxika">

        </div>
        <div class="form-group my-2">
            <label for="exampleInputPassword1">Posta Elektronikoa</label>
            <input type="password" class="form-control"
                id="exampleInputPassword1" placeholder="Password">
        </div>
        <div class="form-group my-2">
            <label for="select">Zein ibilbide interesatzen zaizu?</label>
            <select class="form-select" aria-label="Default select example">
                <option selected>Aukeratu bat...</option>
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
        </div>
        <div class="form-group my-2">
            <label for="select">Mezua</label>
            <textarea placeholder="Idatzi mezua" class="form-control" id="exampleFormControlTextarea1"
                rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
