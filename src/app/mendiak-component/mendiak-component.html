<!DOCTYPE html>
<html lang="eu">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EcoMendi</title>
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <header>
            <div class="p-3 mb-2 bg-success text-white">
                <div class="d-flex justify-content-around">
                    <h4>EcoMendi</h4>
                    <button type="button" class="btn btn-outline-light"><i
                            class="bi bi-list"></i></button>
                </div>
            </div>
        </header>

        <main>
            <div class="w-100 text-white p-5"
                style="background-image: url('https://planesconduende.com/wp-content/uploads/2026/08/photo-1469474968028-56623f02e42e.webp'); background-size: cover; background-position: center; min-height: 300px;">

                <h1 class="d-flex justify-content-center">Ezagutu Euskal Herriko
                    Mendiak</h1>

                <h1 class="d-flex justify-content-center">
                    Mendiak</h1>

                <p class="d-flex justify-content-center">Gida profesionalekin
                    egindako ibilbide ekologiko eta
                    seguruak</p>
                <div class="d-flex justify-content-center">
                    <div style="grid-template-columns: 1fr 1fr;"
                        class="d-grid gap-0 column-gap-3">
                        <button type="button"
                            class="btn btn-warning"><strong>Eserlekua
                                erreserbatu</strong></button>
                        <button type="button"
                            class="btn btn-outline-light">Ibilbideak
                            Ikusi</button>
                    </div>

                </div>

            </div>
        </main>

    </body>
</html>
